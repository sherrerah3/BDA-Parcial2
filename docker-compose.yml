services:
  postgres-primary:
    image: postgres:16
    container_name: pg-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleetdb
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./postgres/primary/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init/00-init-primary.sh:/docker-entrypoint-initdb.d/00-init-primary.sh:ro
    networks:
      - pgnet

  postgres-replica-1:
    image: postgres:16
    container_name: pg-replica-1
    restart: unless-stopped
    depends_on:
      - postgres-primary
    environment:
      POSTGRES_PASSWORD: postgres
      REPL_PASSWORD: replpass
    command: ["bash", "/usr/local/bin/setup-replica.sh", "postgres-primary", "5432"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - replica1_data:/var/lib/postgresql/data
      - ./scripts/setup-replica.sh:/usr/local/bin/setup-replica.sh:ro
      - ./postgres/replica/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - pgnet

  postgres-replica-2:
    image: postgres:16
    container_name: pg-replica-2
    restart: unless-stopped
    depends_on:
      - postgres-primary
    environment:
      POSTGRES_PASSWORD: postgres
      REPL_PASSWORD: replpass
    command: ["bash", "/usr/local/bin/setup-replica.sh", "postgres-primary", "5432"]
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - replica2_data:/var/lib/postgresql/data
      - ./scripts/setup-replica.sh:/usr/local/bin/setup-replica.sh:ro
      - ./postgres/replica/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - pgnet

volumes:
  primary_data:
  replica1_data:
  replica2_data:

networks:
  pgnet:
    driver: bridge
